コーヒーのメリット
身体的効果

覚醒・集中力向上 — カフェインが眠気を抑え、集中力・反応速度を高める
運動パフォーマンス向上 — 脂肪燃焼を促進し、持久力をサポート
代謝促進 — カフェインが基礎代謝をわずかに上げる
健康面

抗酸化作用 — ポリフェノール（クロロゲン酸）が豊富で、細胞の酸化を抑制
2型糖尿病リスク低減 — 定期的な摂取でリスクが下がるという研究あり
肝臓保護 — 肝硬変・肝がんのリスク低下との関連が示されている
アルツハイマー・パーキンソン病リスク低減 — 長期研究で相関が報告されている
気分・精神面

気分改善 — ドーパミン分泌を促し、軽い幸福感をもたらす
うつリスク低下 — 適度な摂取でリスク低下の研究あり
注意点

飲みすぎ（目安：1日3〜4杯程度）は不眠・動悸・胃腸不快の原因になる
カフェインへの感受性は個人差が大きい