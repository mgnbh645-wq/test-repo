各指標の算出ロジック
シートの項目がどう計算されるかも整理しておくと管理しやすくなります。

稼働時間 = 全労働時間 − 停止時間
稼働率 = 稼働時間 ÷ 全労働時間 × 100
時間当たり = ラインスピード × 60 ÷ （適切な係数）
歩留まり率 = 生産数 ÷ 投入数量 × 100
1色当たり時間 = 段替時間 ÷ 段替色数
調色1色時間 = 調色時間 ÷ 段替色数
その他1色当たり = その他時間 ÷ 段替色数

